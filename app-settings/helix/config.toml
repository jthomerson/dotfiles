theme = "ao"

[editor]
rulers = [90, 140]
bufferline = "always"
text-width = 90
auto-format = false
insert-final-newline = true

[editor.file-picker]
git-ignore = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[keys.normal]
X = "extend_line_above"
esc = ["collapse_selection", "keep_primary_selection"]
# Smart reflow via `par` (brew install par). Unlike :reflow, par keeps the
# indentation and per-line comment/quote prefix on every wrapped line, even
# when reflowing a single line. The `reflow` wrapper picks a quote-prefix set
# by language (via %{language}) so markdown bullets/headings aren't corrupted
# while code comments keep their token. A-r wraps at 90; A-w at 140.
# https://github.com/helix-editor/helix/issues/3332
A-r = ["extend_to_line_bounds", ":pipe ~/.config/helix/reflow 90 %{language}"]
A-w = ["extend_to_line_bounds", ":pipe ~/.config/helix/reflow 140 %{language}"]

[editor.statusline]
left = ["mode", "spacer", "diagnostics", "workspace-diagnostics", "spacer", "file-name", "spacer", "spinner"]
right = ["version-control", "spacer", "position", "spacer"]
